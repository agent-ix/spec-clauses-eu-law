[tool.poetry]
name = "spec_clauses_eu_law"
version = "0.1.0"
description = "EU law compliance clause sets"
license = "AGPL-3.0-or-later"
authors = ["Agent IX <agents@agent-ix.dev>"]
packages = [{ include = "spec_clauses_eu_law" }]
include = [
    { path = "spec_clauses_eu_law/manifest.yaml", format = ["sdist", "wheel"] },
    { path = "spec_clauses_eu_law/clauses/*.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
pytest = "^9.0.2"
PyYAML = "^6.0.2"
ruff = "^0.14.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["trace: Bind a test to one or more spec criteria."]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
^/\.deps/engineering-assurance/
'''

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID"]
ignore = ["E203"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
