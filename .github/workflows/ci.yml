name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/checkout@v4
        with:
          repository: agent-ix/engineering-assurance
          ref: v0.10.1
          path: .deps/engineering-assurance
      - uses: actions/checkout@v4
        with:
          repository: agent-ix/spec-clauses-us-health
          ref: ca78ac063186e5ff8d8e074382a3527b6b84d0b8
          path: .deps/spec-clauses-us-health
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Python test and packaging tools
        run: python -m pip install poetry pytest PyYAML black ruff
      - name: Install project test dependencies
        run: poetry install --no-interaction --no-root
      - name: Install Quire and Quoin CLIs
        run: npm ci --userconfig /dev/null --registry https://registry.npmjs.org/ --@agent-ix:registry=https://registry.npmjs.org/
      - name: Add engine CLIs to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install default Quire modules
        run: quoin module ensure-defaults
      - name: Validate specification documents
        run: quire validate 'spec/**/*.md' --module "$GITHUB_WORKSPACE/spec_clauses_eu_law" --module "$HOME/.ix/filament/modules/spec-artifacts-iso" --module "$HOME/.ix/filament/modules/spec-artifacts-process"
      - name: Check clause-set publication rights
        run: quire publish-check --module "$GITHUB_WORKSPACE/spec_clauses_eu_law"
      - name: Install the pinned NIST module for crosswalk tests
        run: quoin module install github:agent-ix/spec-objects-security//spec_objects_security@v0.13.0
      - name: Install the pinned HIPAA module for crosswalk tests
        run: quoin module install path:$GITHUB_WORKSPACE/.deps/spec-clauses-us-health/spec_clauses_us_health
      - name: Build engineering-assurance content rights checker
        run: cargo build --locked --features full --manifest-path .deps/engineering-assurance/Cargo.toml
      - name: Add engineering-assurance to PATH
        run: echo "$GITHUB_WORKSPACE/.deps/engineering-assurance/target/debug" >> "$GITHUB_PATH"
      - name: Verify module, rights, catalog, and distributions
        run: pytest
      - name: Check Python style
        run: make lint
